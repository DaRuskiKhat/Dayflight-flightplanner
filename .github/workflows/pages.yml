name: Deploy to GitHub Pages

# Optional backup host. Hosting is on Cloudflare Pages, so this only runs when
# started by hand (Actions tab -> Deploy to GitHub Pages -> Run workflow).
# To make GitHub Pages the main host, add back:  push: { branches: [main] }
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check app
        run: |
          node --check dist/app.js
          node check.cjs
          node check-simbrief.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
